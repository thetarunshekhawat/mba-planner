# The real alerts dispatcher.
#
# Vercel Hobby caps cron granularity at once per day, which is useless for
# "remind me 3 hours before the round closes" — so vercel.json's daily run is
# only a safety net and this is the actual driver.
#
# GitHub delays scheduled runs under load, sometimes by many minutes. That is
# fine and expected: lib/alerts/schedule.ts fires anything whose due time has
# passed, and only gives up once the deadline itself is more than six hours old.
#
# ⚠️ GitHub disables scheduled workflows after 60 days without repository
# activity. If reminders quietly stop, check that first — the Actions tab will
# show the schedule as disabled. workflow_dispatch below lets you re-arm it with
# one manual run, and the admin Alerts panel's rising `skipped_stale` count is
# the in-app signal that this has happened.
#
# Secrets required: ALERTS_DISPATCH_URL, CRON_SECRET

name: Alerts dispatch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A slow run must not overlap the next tick and double-process the queue.
# (The delivery ledger would dedupe it anyway — this just avoids the churn.)
concurrency:
  group: alerts-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger dispatcher
        env:
          URL: ${{ secrets.ALERTS_DISPATCH_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::ALERTS_DISPATCH_URL or CRON_SECRET is not set"
            exit 1
          fi

          response=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H 'Content-Type: application/json' \
            -w '\n%{http_code}' \
            --max-time 120)

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Dispatcher returned $status"
            exit 1
          fi
