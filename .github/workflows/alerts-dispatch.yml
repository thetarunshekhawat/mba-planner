# The real alerts dispatcher.
#
# Vercel Hobby caps cron granularity at once per day, which is useless for
# "remind me 3 hours before the round closes" — so vercel.json's daily run is
# only a safety net and this is the actual driver.
#
# ⚠️ `*/15` IS AN ASK, NOT A PROMISE. GitHub's scheduler is best-effort and
# drops most high-frequency ticks on free/public repos. Measured on this repo
# over an 8-hour window: 33 ticks requested, 5 delivered — gaps of 104-154
# minutes. Plan for roughly two-hourly, not quarter-hourly.
#
# What that costs: `T-3h` reminders can land at T-1h (still useful) and `T-0`
# reminders can land up to two hours AFTER the deadline (useless, though still
# inside STALE_GRACE_MS so they do send). If sub-hour accuracy starts to matter,
# the fix is a second driver hitting the same endpoint — an external cron with
# custom-header support, or any host that will POST every 15 minutes. Two
# dispatchers racing is safe by construction: alert_deliveries'
# UNIQUE (user_id, dedupe_key) means they send exactly one notification between
# them. See "Two drivers, one guard" in CLAUDE.md.
#
# The minutes below are deliberately offset off :00/:15/:30/:45. Those are the
# most contended slots on GitHub's scheduler and the first to be dropped.
#
# Runs also fail outright with "The job was not acquired by Runner of type
# hosted" when GitHub cannot allocate a runner. That is a GitHub incident, not a
# fault here: the job never starts, `runner_name` comes back empty, and
# `timeout-minutes` does not apply because it only counts from acquisition.
# Nothing to fix and nothing to re-run — the next tick redoes any work that was
# due, because lib/alerts/schedule.ts fires on what is due rather than on what
# this run was "supposed" to cover.
#
# ⚠️ GitHub disables scheduled workflows after 60 days without repository
# activity. If reminders quietly stop, check that first — the Actions tab will
# show the schedule as disabled. workflow_dispatch below lets you re-arm it with
# one manual run, and the admin Alerts panel's rising `skipped_stale` count is
# the in-app signal that this has happened.
#
# Secrets required: ALERTS_DISPATCH_URL, CRON_SECRET

name: Alerts dispatch

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

# A slow run must not overlap the next tick and double-process the queue.
# (The delivery ledger would dedupe it anyway — this just avoids the churn.)
concurrency:
  group: alerts-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger dispatcher
        env:
          URL: ${{ secrets.ALERTS_DISPATCH_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::ALERTS_DISPATCH_URL or CRON_SECRET is not set"
            exit 1
          fi

          response=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H 'Content-Type: application/json' \
            -w '\n%{http_code}' \
            --max-time 120)

          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP $status"
          echo "$body"

          if [ "$status" != "200" ]; then
            echo "::error::Dispatcher returned $status"
            exit 1
          fi
